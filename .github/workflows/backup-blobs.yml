name: Back up signed contracts

# Daily copy of the private Blob store's booking records, parked
# replies, reply-quality records and funnel counts into a GitHub Actions artifact (kept 90
# days). Records a "backup" heartbeat that /admin shows as "Latest backup".
# Restore: see README.md. Skipped, not failed, until BLOB_READ_WRITE_TOKEN is set.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - name: Copy the Blob store
        run: npx tsx scripts/backupBlobs.ts blob-backup
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_NAMESPACE: production
      - name: Keep the copy
        if: ${{ hashFiles('blob-backup/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-backup
          path: blob-backup
          retention-days: 90
      # Marks "Latest backup" Down on /admin, which Thomas's CAO health
      # check reads (README "Who gets alerted").
      - name: Report a failed backup
        if: ${{ failure() }}
        run: npx tsx scripts/recordFailedRun.ts backup "The daily backup"
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_NAMESPACE: production
