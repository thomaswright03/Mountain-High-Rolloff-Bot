name: Model check

# Runs `npm run eval` (scripts/evalDrafts.ts) by hand from the Actions tab:
# sends the tricky lead messages in lib/draftChecks.ts to the real model,
# grades each draft with code and prints docs/eval-results.md to the log,
# also saved as a run artifact. Uses the ANTHROPIC_API_KEY repo secret, so
# nobody needs the key on their own computer. Costs a few cents per run.
# Re-run after any prompt or model change.
on:
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - name: Run the model check
        run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Print the results
        if: ${{ always() }}
        run: cat docs/eval-results.md || echo "No results file was written."
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: eval-results
          path: docs/eval-results.md
          if-no-files-found: ignore
