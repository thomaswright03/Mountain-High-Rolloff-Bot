name: Send roll-off texts

# Roll-off dumpster abandoned-cart texts (Thomas, 2026-10-10). First picks
# up new leads from MTS's roll-off lead list (mts-sync/importRollOffLeads.ts),
# then runs mts-sync/sendRollOffTexts.ts, which sends whichever text is due for each
# contact tagged ai-rolloff-eligible: the first text on the first run after they
# leave the booking form, a next-day nudge, and one final nudge a week
# later, the same drip as the residential bot. Needs Playwright because it
# checks MTS's real Contracts data before every real send, so nobody who
# already finished booking gets texted to finish.
#
# LIVE since 2026-11-03: the repo variable DRY_RUN is "false" (the default
# here is still "true", so a missing variable means test mode; Settings >
# Secrets and variables > Actions > Variables, no commit needed) and
# ROLLOFF_TCPA_CONSENT_CONFIRMED is true in lib/rollOff.ts. With DRY_RUN
# off, a missing or unreachable kill-switch flag (KILLSWITCH_URL) means
# PAUSED (lib/killswitch.ts).
#
# A failed or partly failed step fails the job. The send step runs even if
# pick-up failed, and a final step marks the failed job Down on /admin,
# which is how Thomas hears about it (README "Who gets alerted").
on:
  schedule:
    # Every 30 minutes, same as the residential bot's send-outreach.yml
    # (Thomas, 2026-11-03). Every 10 used too many paid Actions minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: send-rolloff-texts
  cancel-in-progress: false

jobs:
  send-rolloff-texts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Reads MTS's roll-off lead list and tags new leads in GHL. Skipped,
      # not failed, until the MTS login secrets are added.
      - name: Pick up new roll-off leads
        id: pickup
        run: |
          if [ -z "$MTS_EMAIL" ] || [ -z "$MTS_PASSWORD" ]; then
            echo "::notice::MTS_EMAIL / MTS_PASSWORD secrets not set yet, skipping lead pick-up."
            exit 0
          fi
          npm run rolloff:import
        env:
          MTS_EMAIL: ${{ secrets.MTS_EMAIL }}
          MTS_PASSWORD: ${{ secrets.MTS_PASSWORD }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_COMPANY_FIELD_KEY: ${{ secrets.GHL_COMPANY_FIELD_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          KILLSWITCH_URL: ${{ secrets.KILLSWITCH_URL }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          # Same Blob folders as the Vercel site's production, so /admin sees this job.
          BLOB_NAMESPACE: production

      # Every contact it checks comes from GHL (connected since 2026-10-22).
      # Skipped, not failed, if the GHL secrets are ever removed.
      - name: Send roll-off texts
        id: send
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$GHL_API_TOKEN" ] || [ -z "$GHL_LOCATION_ID" ]; then
            echo "::notice::GHL_API_TOKEN / GHL_LOCATION_ID secrets not set yet, skipping texts."
            exit 0
          fi
          npm run rolloff:send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MTS_EMAIL: ${{ secrets.MTS_EMAIL }}
          MTS_PASSWORD: ${{ secrets.MTS_PASSWORD }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          KILLSWITCH_URL: ${{ secrets.KILLSWITCH_URL }}
          # The Vercel project's Blob store token, so each lead's first text
          # is counted on the dashboard (lib/funnelStore.ts). Optional.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          # Same Blob folders as the Vercel site's production, so /admin sees this job.
          BLOB_NAMESPACE: production

      # Marks the failed job Down on /admin and /admin/status.json, which
      # Thomas's CAO health check reads (README "Who gets alerted").
      - name: Report a failed run
        if: ${{ failure() }}
        run: |
          # Pick-up failed: mark pick-up. Texting failed, or the job broke
          # before either ran (setup): mark the texting row.
          if [ "$PICKUP" = "failure" ]; then npx tsx scripts/recordFailedRun.ts rolloff-import "Lead pick-up"; fi
          if [ "$SEND" = "failure" ] || [ "$PICKUP" != "failure" ]; then npx tsx scripts/recordFailedRun.ts rolloff-send "The texting job"; fi
        env:
          PICKUP: ${{ steps.pickup.outcome }}
          SEND: ${{ steps.send.outcome }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_NAMESPACE: production
