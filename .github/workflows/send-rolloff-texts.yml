name: Send roll-off texts

# Roll-off dumpster abandoned-cart texts (Thomas, 2026-10-10). First picks
# up new leads from MTS's roll-off lead list (mts-sync/importRollOffLeads.ts),
# then runs mts-sync/sendRollOffTexts.ts, which sends whichever text is due for each
# contact tagged ai-rolloff-eligible: the first text ~30 min after they
# leave the booking form, a next-day nudge, and one final nudge three days
# later. Needs Playwright because it
# checks MTS's real Contracts data before every real send, so nobody who
# already finished booking gets texted to finish.
#
# TEST MODE (Thomas, 2026-10-10: don't reach out to any real leads yet):
# DRY_RUN is "true" unless the repo variable DRY_RUN is set to something
# else (Settings > Secrets and variables > Actions > Variables), so going
# live or back to test mode needs no commit. Going live also needs
# ROLLOFF_TCPA_CONSENT_CONFIRMED set to true in sendRollOffTexts.ts, and
# KILLSWITCH_URL set: with DRY_RUN off, a missing or unreachable kill-switch
# flag means PAUSED (lib/killswitch.ts).
#
# A failed or partly failed step fails the job. The send step runs even if
# pick-up failed, and a final step reports any failure to Hitta.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: send-rolloff-texts
  cancel-in-progress: false

jobs:
  send-rolloff-texts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Reads MTS's roll-off lead list and tags new leads in GHL. Skipped,
      # not failed, until the MTS login secrets are added.
      - name: Pick up new roll-off leads
        run: |
          if [ -z "$MTS_EMAIL" ] || [ -z "$MTS_PASSWORD" ]; then
            echo "::notice::MTS_EMAIL / MTS_PASSWORD secrets not set yet, skipping lead pick-up."
            exit 0
          fi
          npm run rolloff:import
        env:
          MTS_EMAIL: ${{ secrets.MTS_EMAIL }}
          MTS_PASSWORD: ${{ secrets.MTS_PASSWORD }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_COMPANY_FIELD_KEY: ${{ secrets.GHL_COMPANY_FIELD_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          KILLSWITCH_URL: ${{ secrets.KILLSWITCH_URL }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}

      # Every contact it checks comes from GHL. GHL is on hold (Thomas,
      # 2026-10-10: they may set up a new GHL account for this), so this
      # step is skipped, not failed, until the GHL secrets are added.
      - name: Send roll-off texts
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$GHL_API_TOKEN" ] || [ -z "$GHL_LOCATION_ID" ]; then
            echo "::notice::GHL_API_TOKEN / GHL_LOCATION_ID secrets not set yet, skipping texts."
            exit 0
          fi
          npm run rolloff:send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MTS_EMAIL: ${{ secrets.MTS_EMAIL }}
          MTS_PASSWORD: ${{ secrets.MTS_PASSWORD }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          KILLSWITCH_URL: ${{ secrets.KILLSWITCH_URL }}
          # The Vercel project's Blob store token, so each lead's first text
          # is counted on the dashboard (lib/funnelStore.ts). Optional.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}

      # Tells Thomas (through Hitta) when either step failed. Skipped, with a
      # warning in the run log, until the HITTA_API_KEY secret is added.
      - name: Report a failed run
        if: ${{ failure() }}
        run: |
          if [ -z "$HITTA_API_KEY" ]; then
            echo "::warning::The roll-off job failed and HITTA_API_KEY is not set, so nobody was alerted."
            exit 0
          fi
          curl -s -X POST -H "Authorization: Bearer $HITTA_API_KEY" -H "Content-Type: application/json" \
            -d "{\"project\":\"Mountain High Roll-Off Bot\",\"title\":\"The roll-off bot's scheduled job failed\",\"summary\":\"A run of the roll-off texting job failed or partly failed. Check the GitHub Actions run history for Mountain High Rolloff Bot.\",\"urgency\":\"normal\"}" \
            https://34-67-123-90.sslip.io/reports || true
        env:
          HITTA_API_KEY: ${{ secrets.HITTA_API_KEY }}
